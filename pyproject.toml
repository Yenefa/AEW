[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aew"
version = "2.1.0"
description = "AEW — Project Situational Awareness (v0) + Terminal Decision Layer (v1) + Team Hub (v2)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AEW contributors" }]
dependencies = []

[project.scripts]
aew = "aew.cli:main"

[tool.setuptools]
packages = ["aew", "aew.loaders", "aew.hub", "aew.tests"]

[tool.setuptools.package-data]
aew = ["examples/**/*.md"]
